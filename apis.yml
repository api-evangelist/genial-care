aid: genial-care
name: Genial Care
description: >-
  Genial Care is a Brazilian healthtech network providing multidisciplinary,
  evidence-based care for children with autism spectrum disorder (ASD) and
  atypical development up to roughly eight years of age. Founded in 2020 in
  Sao Paulo, it operates a network of clinics ("Casas Geniais") across Greater
  Sao Paulo delivering ABA (applied behavior analysis), speech-language therapy,
  and occupational therapy, alongside family assessments, in-person and online
  consultations, educational content, and a professional training academy. Care
  is coordinated through a proprietary mobile app that supports continuous
  monitoring and family engagement. The company partners with major Brazilian
  health plans (operadoras), which account for the majority of its revenue, and
  is backed by General Catalyst. Genial Care operates as a consumer/clinical
  care provider and does not publish a public developer API surface.
